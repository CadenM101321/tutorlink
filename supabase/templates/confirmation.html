<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 24px;font-size:16px;font-weight:600;color:#15803d;">TutorLink</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600;">Confirm your email</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#404040;">
                  Thanks for signing up. Confirm that {{ .Email }} is your email address to finish creating your account.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;padding:12px 20px;background:#15803d;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;border-radius:10px;">
                  Confirm email
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b6b6b;">
                  This link works once and expires in 1 hour. If you didn't sign up for TutorLink, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
